[project]
name = "document-field-extractor"
version = "0.1.0"
description = "Local, evidence-grounded field extraction from text PDFs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "paddleocr>=3.7,<3.8",
    "paddlepaddle>=3.2,<3.3",
    "pypdf>=5,<6",
    "pymupdf>=1.24,<2",
    "python-multipart>=0.0.12,<1",
    "torch>=2.0,<3",
    "torchvision>=0.19,<1",
    "transformers>=5.16,<6",
    "accelerate>=1,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
v2 = [
    "docling[rapidocr]>=2,<3",
]
benchmark = [
    "paddlex[ocr]==3.7.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

